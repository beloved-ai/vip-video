<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP追剧神器</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <span class="logo">🎬</span>
      <h1>VIP追剧神器</h1>
    </div>
    <span class="tag">仅供学习</span>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchMode('search')">
      <span class="tab-icon">🔍</span> 搜索剧名
    </button>
    <button class="tab" onclick="switchMode('url')">
      <span class="tab-icon">🔗</span> 网址解析
    </button>
  </div>

  <!-- 搜索模式 -->
  <div id="searchMode" class="mode-panel active">
    <div class="center-area">
      <div class="hero-icon">🎬</div>
      <h2 class="hero-title">搜索你想看的剧</h2>
      <p class="hero-sub">输入剧名，选择站点，一键搜索播放（含VIP内容）</p>
      <div class="search-bar-center">
        <input type="text" id="searchInput" placeholder="输入剧名，如：庆余年、繁花、三体..." />
        <button onclick="searchAndOpen()">🔍 搜索</button>
      </div>
      <div class="site-grid">
        <button class="site-card active" data-site="https://www.360zy.com/vodsearch/-------------.html?wd=" onclick="selectSite(this)">
          <span class="site-name">360</span>
          <span class="site-desc">多线路</span>
        </button>
        <button class="site-card" data-site="https://subo988.com/search.html?wd=" onclick="selectSite(this)">
          <span class="site-name">速播</span>
          <span class="site-desc">播放快</span>
        </button>
        <button class="site-card" data-site="https://www.wlzy.tv/vodsearch/-------------.html?wd=" onclick="selectSite(this)">
          <span class="site-name">卧龙</span>
          <span class="site-desc">高清源</span>
        </button>
        <button class="site-card" data-site="https://www.tkzyw.com/vodsearch/-------------.html?wd=" onclick="selectSite(this)">
          <span class="site-name">天空</span>
          <span class="site-desc">资源全</span>
        </button>
      </div>
      <p class="hint-text">💡 搜不到？换一个站点再试</p>
    </div>
  </div>

  <!-- 网址模式 -->
  <div id="urlMode" class="mode-panel">
    <div class="search-bar">
      <input type="text" id="urlInput" placeholder="粘贴视频网址 (爱奇艺/腾讯/优酷/芒果TV/B站...)" />
      <button onclick="playVideo()">播放</button>
    </div>
    <div class="source-row">
      <span class="source-label">解析源:</span>
      <button class="source-chip active" data-src="https://jx.xmflv.com/?url=" onclick="switchSource(this)">XMFLV</button>
      <button class="source-chip" data-src="https://jx.bozrc.com:4433/player/?url=" onclick="switchSource(this)">备用1</button>
      <button class="source-chip" data-src="https://jx.playerjy.com/?url=" onclick="switchSource(this)">备用2</button>
      <button class="source-chip" data-src="https://www.yemu.xyz/?url=" onclick="switchSource(this)">备用3</button>
      <a class="source-chip link" href="https://www.iqiyi.com" target="_blank">爱奇艺</a>
      <a class="source-chip link" href="https://v.qq.com" target="_blank">腾讯</a>
      <a class="source-chip link" href="https://www.youku.com" target="_blank">优酷</a>
    </div>
    <div class="player-frame-wrap">
      <div id="urlPlaceholder" class="placeholder">
        <div class="placeholder-icon">📺</div>
        <p>粘贴视频网址，点击播放</p>
        <p class="sub">支持爱奇艺、腾讯视频、优酷、芒果TV、B站等主流平台</p>
      </div>
      <iframe id="urlFrame" class="player-frame" frameborder="0" allowfullscreen
              allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
              style="display:none;"></iframe>
    </div>
    <div id="nowPlaying" class="now-playing" style="display:none;">
      <span class="now-label">正在播放:</span>
      <span id="nowUrl" class="now-url"></span>
      <button class="btn-tiny" onclick="copyCurrentUrl()">复制</button>
      <button class="btn-tiny" onclick="openInNewTab()">新窗口</button>
    </div>
  </div>

  <footer class="footer">
    <span>VIP追剧神器 · 仅供学习使用</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
