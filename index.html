<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP追剧神器</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <span class="logo">🎬</span>
      <h1>VIP追剧神器</h1>
    </div>
    <span class="tag">仅供学习</span>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchMode('search')">
      <span class="tab-icon">🔍</span> 搜索剧名
    </button>
    <button class="tab" onclick="switchMode('url')">
      <span class="tab-icon">🔗</span> 网址解析
    </button>
  </div>

  <!-- 搜索模式 -->
  <div id="searchMode" class="mode-panel active">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="输入剧名，如：庆余年、繁花、三体..." />
      <button onclick="doSearch()">搜索</button>
    </div>
    <!-- 搜索结果列表 -->
    <div id="searchResults" class="search-results"></div>
    <!-- 播放器区域 -->
    <div id="playerArea" class="player-area" style="display:none;">
      <div class="player-header">
        <button class="btn-back" onclick="closePlayer()">← 返回</button>
        <span id="playerTitle" class="player-title"></span>
        <button class="btn-tiny" onclick="openPlayerNewTab()">新窗口播放</button>
      </div>
      <iframe id="playFrame" class="play-frame" frameborder="0" allowfullscreen
              allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
  </div>

  <!-- 网址模式 -->
  <div id="urlMode" class="mode-panel">
    <div class="search-bar">
      <input type="text" id="urlInput" placeholder="粘贴视频网址 (爱奇艺/腾讯/优酷/芒果TV/B站...)" />
      <button onclick="playUrl()">播放</button>
    </div>
    <div class="source-row">
      <span class="source-label">解析源:</span>
      <button class="source-chip active" data-src="https://jx.xmflv.com/?url=" onclick="switchSrc(this)">XMFLV</button>
      <button class="source-chip" data-src="https://jx.playerjy.com/?url=" onclick="switchSrc(this)">备用1</button>
      <button class="source-chip" data-src="https://www.yemu.xyz/?url=" onclick="switchSrc(this)">备用2</button>
      <button class="source-chip" data-src="https://jx.m3u8.tv/jiexi/?url=" onclick="switchSrc(this)">备用3</button>
      <a class="source-chip link" href="https://www.iqiyi.com" target="_blank">爱奇艺</a>
      <a class="source-chip link" href="https://v.qq.com" target="_blank">腾讯</a>
      <a class="source-chip link" href="https://www.youku.com" target="_blank">优酷</a>
    </div>
    <div class="player-frame-wrap">
      <div id="urlPlaceholder" class="placeholder">
        <div class="placeholder-icon">📺</div>
        <p>粘贴视频网址，点击播放</p>
        <p class="sub">支持爱奇艺、腾讯视频、优酷等主流平台VIP内容解析</p>
      </div>
      <iframe id="urlFrame" class="player-frame" frameborder="0" allowfullscreen
              allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
              style="display:none;"></iframe>
    </div>
  </div>

  <footer class="footer">
    <span>VIP追剧神器 · 仅供学习使用</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
